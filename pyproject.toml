[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501: la longitud la impone `ruff format`; los comentarios en prosa pueden pasarse.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Los tests reasignan atributos privados de sus propios dobles a propósito.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
# El código no está anotado del todo: se exige coherencia donde hay anotaciones,
# sin obligar a anotarlo entero de golpe.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
